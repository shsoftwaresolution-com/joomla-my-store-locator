MOD_MYSTORELOCATOR="My Store Locator"
MOD_MYSTORELOCATOR_XML_DESCRIPTION="Zeigt Ihre <a href='https://my-store-locator.com/?utm_source=joomla&amp;utm_medium=integration&amp;utm_campaign=joomla-plugin' target='_blank' rel='noopener'>My Store Locator</a>-Karte (Filialfinder / Standortkarte) auf Ihrer Joomla-Seite. Karten-Token oder Einbettungscode einfügen – die Karte wird von app.my-store-locator.com (Hosting in Deutschland) geladen, standardmäßig mit Zwei-Klick-Platzhalter (Einwilligung)."
MOD_MYSTORELOCATOR_INTRO_LABEL="My Store Locator Karte"
MOD_MYSTORELOCATOR_INTRO_DESC="Pflegen Sie Ihre Standorte in <a href='https://app.my-store-locator.com/?utm_source=joomla&amp;utm_medium=integration&amp;utm_campaign=joomla-plugin' target='_blank' rel='noopener'>app.my-store-locator.com</a>, öffnen Sie dort Ihre Karte unter „Einbetten“ und kopieren Sie den Karten-Token (oder den ganzen Einbettungscode / Kartenlink) in das Feld unten. Noch kein Konto? <a href='https://app.my-store-locator.com/#/register?utm_source=joomla' target='_blank' rel='noopener'>Kostenlos registrieren</a>. Die Karte wird von app.my-store-locator.com (Hosting in Deutschland) geladen; dabei wird die IP-Adresse der Besucher an diesen Server übertragen – siehe <a href='https://my-store-locator.com/datenschutz/?utm_source=joomla&amp;utm_medium=integration&amp;utm_campaign=joomla-plugin' target='_blank' rel='noopener'>Datenschutzerklärung</a>."
MOD_MYSTORELOCATOR_FIELD_TOKEN_LABEL="Karten-Token"
MOD_MYSTORELOCATOR_FIELD_TOKEN_DESC="Der Karten-Token, der Einbettungscode (iframe oder Widget) oder der öffentliche Kartenlink (…/#/m/&lt;token&gt;). Der Token wird beim Speichern automatisch herausgelesen."
MOD_MYSTORELOCATOR_FIELD_TOKEN_HINT="Karten-Token, Einbettungscode oder Kartenlink"
MOD_MYSTORELOCATOR_FIELD_TOKEN_INVALID="Kein gültiger Karten-Token gefunden. Fügen Sie den Token (6–64 Zeichen: Buchstaben, Ziffern, - und _), den Einbettungscode oder den Kartenlink ein."
MOD_MYSTORELOCATOR_FIELD_TOKEN_OK="Karten-Token erkannt: %s"
MOD_MYSTORELOCATOR_CONNECT_BUTTON="Mit My Store Locator verbinden"
MOD_MYSTORELOCATOR_CONNECT_DONE="Karte verbunden: %s – Modul speichern, um es zu übernehmen."
MOD_MYSTORELOCATOR_CONNECT_BLOCKED="Das Popup wurde blockiert. Popups für diese Seite erlauben oder den Karten-Token von Hand einfügen."
MOD_MYSTORELOCATOR_CONNECT_NEEDS_HTTPS="Der Verbinden-Button braucht eine Seite mit HTTPS. Den Karten-Token können Sie jederzeit von Hand einfügen."
MOD_MYSTORELOCATOR_REGISTER_LINK="Kostenlos registrieren"
MOD_MYSTORELOCATOR_FIELD_HEIGHT_LABEL="Höhe"
MOD_MYSTORELOCATOR_FIELD_HEIGHT_DESC="<code>auto</code> (empfohlen): Die Karte wächst mit ihrem Inhalt, die Seite scrollt. Oder eine feste Höhe wie <code>640px</code>, <code>80vh</code> oder einfach <code>640</code>."
MOD_MYSTORELOCATOR_FIELD_LANGUAGE_LABEL="Kartensprache"
MOD_MYSTORELOCATOR_FIELD_LANGUAGE_DESC="Automatisch folgt der Sprache der aktuellen Seite (deutsche Seiten → Deutsch, alle anderen → Englisch)."
MOD_MYSTORELOCATOR_FIELD_LANGUAGE_AUTO="Automatisch (Seitensprache)"
MOD_MYSTORELOCATOR_FIELD_LANGUAGE_DE="Deutsch"
MOD_MYSTORELOCATOR_FIELD_LANGUAGE_EN="Englisch"
MOD_MYSTORELOCATOR_FIELD_CONSENT_LABEL="Einwilligung (Zwei-Klick)"
MOD_MYSTORELOCATOR_FIELD_CONSENT_DESC="Empfohlen (DSGVO): Besucher sehen zuerst einen Platzhalter mit Datenschutzhinweis. Vor dem Klick auf „Karte laden“ wird nichts von app.my-store-locator.com geladen – auch nicht das Widget-Skript."
MOD_MYSTORELOCATOR_FIELD_LAZY_LABEL="Verzögert laden"
MOD_MYSTORELOCATOR_FIELD_LAZY_DESC="Die Karte erst laden, wenn sie in den sichtbaren Bereich scrollt."
MOD_MYSTORELOCATOR_FIELD_LAYOUT_LABEL="Aufteilung"
MOD_MYSTORELOCATOR_FIELD_LAYOUT_DESC="Geteilt: Liste und Karte nebeneinander, die Karte bleibt beim Scrollen der Liste sichtbar (für die Vorlage Finder, braucht Höhe auto)."
MOD_MYSTORELOCATOR_FIELD_LAYOUT_DEFAULT="Standard"
MOD_MYSTORELOCATOR_FIELD_LAYOUT_SPLIT="Geteilt (Liste + mitlaufende Karte)"
MOD_MYSTORELOCATOR_FIELD_OFFSET_LABEL="Abstand fester Kopfbereich (px)"
MOD_MYSTORELOCATOR_FIELD_OFFSET_DESC="Höhe des fixierten Kopfbereichs Ihres Templates in Pixeln, damit die Karte darunter bleibt. 0 = kein fixierter Kopfbereich."
MOD_MYSTORELOCATOR_CONSENT_TEXT="Diese Karte wird von my-store-locator.com geladen (eigener Kartenserver in Deutschland). Dabei wird Ihre IP-Adresse an diesen Server übertragen."
MOD_MYSTORELOCATOR_CONSENT_BUTTON="Karte laden"
