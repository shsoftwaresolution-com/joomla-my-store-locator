MOD_MYSTORELOCATOR="My Store Locator"
MOD_MYSTORELOCATOR_XML_DESCRIPTION="Shows your <a href='https://my-store-locator.com/?utm_source=joomla&amp;utm_medium=integration&amp;utm_campaign=joomla-plugin' target='_blank' rel='noopener'>My Store Locator</a> map (store finder / location map) on your Joomla site. Paste the map token or embed code – the map is loaded from app.my-store-locator.com (hosted in Germany), with a click-to-load consent placeholder by default."
MOD_MYSTORELOCATOR_INTRO_LABEL="My Store Locator map"
MOD_MYSTORELOCATOR_INTRO_DESC="Manage your locations in <a href='https://app.my-store-locator.com/?utm_source=joomla&amp;utm_medium=integration&amp;utm_campaign=joomla-plugin' target='_blank' rel='noopener'>app.my-store-locator.com</a>, open your map there under Embed and copy the map token (or the whole embed code / map link) into the field below. No account yet? <a href='https://app.my-store-locator.com/#/register?utm_source=joomla' target='_blank' rel='noopener'>Create a free account</a>. The map is loaded from app.my-store-locator.com (hosted in Germany); the visitor's IP address is sent to that server when the map loads – see the <a href='https://my-store-locator.com/en/privacy/?utm_source=joomla&amp;utm_medium=integration&amp;utm_campaign=joomla-plugin' target='_blank' rel='noopener'>privacy policy</a>."
MOD_MYSTORELOCATOR_FIELD_TOKEN_LABEL="Map token"
MOD_MYSTORELOCATOR_FIELD_TOKEN_DESC="The map token, the embed code (iframe or widget) or the public map link (…/#/m/&lt;token&gt;). The token is extracted automatically when you save."
MOD_MYSTORELOCATOR_FIELD_TOKEN_HINT="Map token, embed code or map link"
MOD_MYSTORELOCATOR_FIELD_TOKEN_INVALID="No valid map token found. Paste the token (6–64 characters: letters, digits, - and _), the embed code or the map link."
MOD_MYSTORELOCATOR_FIELD_TOKEN_OK="Map token recognised: %s"
MOD_MYSTORELOCATOR_CONNECT_BUTTON="Connect with My Store Locator"
MOD_MYSTORELOCATOR_CONNECT_DONE="Map connected: %s – save the module to apply."
MOD_MYSTORELOCATOR_CONNECT_BLOCKED="The popup was blocked. Allow popups for this site or paste the map token manually."
MOD_MYSTORELOCATOR_CONNECT_NEEDS_HTTPS="The connect button needs a site running on HTTPS. You can always paste the map token manually."
MOD_MYSTORELOCATOR_REGISTER_LINK="Create a free account"
MOD_MYSTORELOCATOR_FIELD_HEIGHT_LABEL="Height"
MOD_MYSTORELOCATOR_FIELD_HEIGHT_DESC="<code>auto</code> (recommended): the map grows with its content and the page scrolls. Or a fixed height such as <code>640px</code>, <code>80vh</code> or just <code>640</code>."
MOD_MYSTORELOCATOR_FIELD_LANGUAGE_LABEL="Map language"
MOD_MYSTORELOCATOR_FIELD_LANGUAGE_DESC="Automatic follows the language of the current page (German pages → German, all others → English)."
MOD_MYSTORELOCATOR_FIELD_LANGUAGE_AUTO="Automatic (site language)"
MOD_MYSTORELOCATOR_FIELD_LANGUAGE_DE="German"
MOD_MYSTORELOCATOR_FIELD_LANGUAGE_EN="English"
MOD_MYSTORELOCATOR_FIELD_CONSENT_LABEL="Consent mode (click to load)"
MOD_MYSTORELOCATOR_FIELD_CONSENT_DESC="Recommended (GDPR): visitors first see a placeholder with a privacy notice. Nothing is loaded from app.my-store-locator.com – not even the widget script – until they click &quot;Load map&quot;."
MOD_MYSTORELOCATOR_FIELD_LAZY_LABEL="Lazy loading"
MOD_MYSTORELOCATOR_FIELD_LAZY_DESC="Load the map only when it scrolls into view."
MOD_MYSTORELOCATOR_FIELD_LAYOUT_LABEL="Layout"
MOD_MYSTORELOCATOR_FIELD_LAYOUT_DESC="Split: list and map side by side, the map stays in view while the list scrolls (for the Finder template, needs height auto)."
MOD_MYSTORELOCATOR_FIELD_LAYOUT_DEFAULT="Default"
MOD_MYSTORELOCATOR_FIELD_LAYOUT_SPLIT="Split (list + sticky map)"
MOD_MYSTORELOCATOR_FIELD_OFFSET_LABEL="Sticky header offset (px)"
MOD_MYSTORELOCATOR_FIELD_OFFSET_DESC="Height of your template's sticky header in pixels, so the map stays below it. 0 = no sticky header."
MOD_MYSTORELOCATOR_CONSENT_TEXT="This map is loaded from my-store-locator.com (own map server in Germany). Your IP address is transferred to this server."
